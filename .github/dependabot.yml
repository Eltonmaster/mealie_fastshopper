version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # One PR for all Gradle updates: AGP, the Gradle wrapper, Kotlin, KSP and the
    # AndroidX libraries depend on each other's versions, so updating them in
    # separate PRs produces builds that can never pass on their own.
    groups:
      gradle-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
